name: Update GitHub Activity & Stats

on:
  schedule:
    # Runs every 6 hours automatically
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Live Metrics and Update SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_stats.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-languages.svg assets/github-streak.svg assets/activity-graph.svg
          if git diff --staged --quiet; then
            echo "No stats changes detected."
          else
            git commit -m "chore: auto-update GitHub stats & streak telemetry [skip ci]"
            git push
          fi
