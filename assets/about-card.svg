<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" fill="none" role="img" aria-labelledby="about-title about-desc">
  <title id="about-title">Ahmed Yousef Bakry - About Engineering Profile</title>
  <desc id="about-desc">Dark macOS window displaying Ahmed's machine learning engineering background, education, and technical competencies.</desc>
  <defs>
    <!-- Background Glass Base -->
    <linearGradient id="glass-base-about" x1="0" y1="0" x2="840" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10131e" stop-opacity="0.92"/>
      <stop offset="50%" stop-color="#0a0c14" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#06070b" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Static Base Border Stroke -->
    <linearGradient id="static-border-about" x1="0" y1="0" x2="840" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Animated Laser Tracer Gradient -->
    <linearGradient id="laser-tracer-about" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Ambient Aurora Orbs -->
    <radialGradient id="aurora-about-cyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="aurora-about-purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.26"/>
      <stop offset="60%" stop-color="#7e22ce" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7e22ce" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="aurora-about-emerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#059669" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0"/>
    </radialGradient>

    <!-- Header Frosted Glass Gradient -->
    <linearGradient id="header-glass-about" x1="0" y1="0" x2="0" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Pill Glass Gradient -->
    <linearGradient id="pill-glass-grad-about" x1="0" y1="0" x2="0" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="pill-stroke-grad-about" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Traffic Lights -->
    <linearGradient id="btn-red-about" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b62"/>
      <stop offset="100%" stop-color="#ea3e36"/>
    </linearGradient>
    <linearGradient id="btn-yellow-about" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd043"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <linearGradient id="btn-green-about" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fe25e"/>
      <stop offset="100%" stop-color="#1db939"/>
    </linearGradient>

    <!-- Filter Shadows -->
    <filter id="win-shadow-about" x="-5%" y="-5%" width="110%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="laser-glow-about" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.7"/>
    </filter>
    <filter id="glow-badge-about" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes borderLaserLoopAbout {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -2100; }
    }
    .laser-border-ab {
      stroke: url(#laser-tracer-about);
      stroke-width: 1.8;
      stroke-dasharray: 8 16 32 20 8 16 80 180 8 16 48 180;
      stroke-linecap: round;
      animation: borderLaserLoopAbout 14s linear infinite;
    }
    .laser-border-fast-ab {
      stroke: #34d399;
      stroke-width: 1.5;
      stroke-dasharray: 40 350 80 400;
      stroke-linecap: round;
      animation: borderLaserLoopAbout 9s linear infinite;
      opacity: 0.75;
    }

    @keyframes auroraFloatAb1 {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0.7; }
      33% { transform: translate(50px, -15px) scale(1.15); opacity: 0.95; }
      66% { transform: translate(-25px, 20px) scale(0.9); opacity: 0.6; }
      100% { transform: translate(0px, 0px) scale(1); opacity: 0.7; }
    }
    @keyframes auroraFloatAb2 {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0.65; }
      33% { transform: translate(-60px, 25px) scale(1.2); opacity: 0.9; }
      66% { transform: translate(35px, -10px) scale(0.85); opacity: 0.55; }
      100% { transform: translate(0px, 0px) scale(1); opacity: 0.65; }
    }
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.95; transform: scale(1.3); }
    }
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.3); }
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .aurora-ab-1 { animation: auroraFloatAb1 11s ease-in-out infinite; }
    .aurora-ab-2 { animation: auroraFloatAb2 13s ease-in-out infinite; }
    .star-1 { animation: starTwinkle 3s ease-in-out infinite; }
    .star-2 { animation: starTwinkle 4s ease-in-out infinite 1.2s; }
    .star-3 { animation: starTwinkle 3.5s ease-in-out infinite 0.7s; }

    .window-title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 500; letter-spacing: 0.3px; fill: #86868b; }
    .mono-prompt { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.2px; }
    .about-head { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 800; letter-spacing: -0.2px; fill: #ffffff; }
    .about-role { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 600; fill: #38bdf8; }
    .about-body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 400; line-height: 1.5; fill: #a1a1a6; }
    .pill { fill: url(#pill-glass-grad-about); stroke: url(#pill-stroke-grad-about); stroke-width: 1; rx: 6; }
    .spec-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 500; fill: #e4e4e7; }
    .pulse-dot { transform-origin: 12px 10px; animation: pulseLive 2s ease-in-out infinite; }
    .cursor { fill: #30d158; animation: blinkCursor 1s infinite steps(2, start); }
  </style>

  <!-- Container Base with Deep Drop Shadow -->
  <rect x="2" y="2" width="836" height="226" rx="14" fill="url(#glass-base-about)" stroke="url(#static-border-about)" stroke-width="1.2" filter="url(#win-shadow-about)"/>

  <!-- Clip Path for Internal Aurora -->
  <clipPath id="inner-glass-clip-about">
    <rect x="3" y="3" width="834" height="224" rx="13"/>
  </clipPath>

  <g clip-path="url(#inner-glass-clip-about)">
    <g class="aurora-ab-1">
      <circle cx="150" cy="60" r="160" fill="url(#aurora-about-cyan)"/>
    </g>
    <g class="aurora-ab-2">
      <circle cx="700" cy="120" r="180" fill="url(#aurora-about-purple)"/>
    </g>
    <g class="aurora-ab-1">
      <circle cx="430" cy="180" r="140" fill="url(#aurora-about-emerald)"/>
    </g>

    <!-- Star Twinkles -->
    <g class="star-1" transform="translate(160, 45)"><circle cx="0" cy="0" r="1.4" fill="#38bdf8"/><circle cx="0" cy="0" r="3" fill="#38bdf8" fill-opacity="0.3"/></g>
    <g class="star-2" transform="translate(680, 50)"><circle cx="0" cy="0" r="1.6" fill="#34d399"/><circle cx="0" cy="0" r="4" fill="#34d399" fill-opacity="0.3"/></g>
    <g class="star-3" transform="translate(480, 140)"><circle cx="0" cy="0" r="1.3" fill="#c084fc"/><circle cx="0" cy="0" r="3" fill="#c084fc" fill-opacity="0.3"/></g>
  </g>

  <!-- Animated Running Border Laser Tracer -->
  <rect class="laser-border-ab" x="2" y="2" width="836" height="226" rx="14" fill="none" filter="url(#laser-glow-about)"/>
  <rect class="laser-border-fast-ab" x="2" y="2" width="836" height="226" rx="14" fill="none"/>

  <!-- Frosted Titlebar Header -->
  <path d="M 2 14 C 2 7.37 7.37 2 14 2 L 826 2 C 832.63 2 838 7.37 838 14 L 838 36 L 2 36 Z" fill="url(#header-glass-about)"/>
  <line x1="2" y1="36" x2="838" y2="36" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Glossy Window Controls -->
  <g transform="translate(18, 12)">
    <circle cx="6" cy="6" r="5.5" fill="url(#btn-red-about)"/>
    <circle cx="6" cy="6" r="5.5" stroke="#d63029" stroke-width="0.6" fill="none"/>
    <circle cx="23" cy="6" r="5.5" fill="url(#btn-yellow-about)"/>
    <circle cx="23" cy="6" r="5.5" stroke="#d48d17" stroke-width="0.6" fill="none"/>
    <circle cx="40" cy="6" r="5.5" fill="url(#btn-green-about)"/>
    <circle cx="40" cy="6" r="5.5" stroke="#189e30" stroke-width="0.6" fill="none"/>
  </g>

  <!-- Centered Window Title -->
  <text class="window-title" x="420" y="22" text-anchor="middle">ahmed — engineering overview</text>

  <!-- Top Right Status Badge -->
  <g transform="translate(625, 9)" filter="url(#glow-badge-about)">
    <rect width="195" height="20" rx="10" fill="#0c1d2e" fill-opacity="0.85" stroke="#0284c7" stroke-width="1"/>
    <circle class="pulse-dot" cx="12" cy="10" r="3.5" fill="#38bdf8"/>
    <text font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" x="22" y="13.5">ML ENGINEER • DATA &amp; AI</text>
  </g>

  <!-- About Content Body -->
  <g transform="translate(24, 58)">
    <text class="mono-prompt" x="0" y="0">
      <tspan fill="#34d399">ahmed@workstation</tspan> <tspan fill="#86868b">~ $</tspan> <tspan fill="#f5f5f7">cat profile_overview.json</tspan>
    </text>

    <text class="about-head" x="0" y="26">Machine Learning Engineer &amp; Data Analyst</text>
    <text class="about-body" x="0" y="48">
      Turning complex datasets into predictive machine learning pipelines and actionable business intelligence.
    </text>
    <text class="about-body" x="0" y="68">
      Specialized in <tspan fill="#38bdf8" font-weight="600">Exploratory Data Analysis (EDA)</tspan>, <tspan fill="#34d399" font-weight="600">Deep Learning</tspan>, NLP with Attention Models, and Computer Vision.
    </text>
    <text class="about-body" x="0" y="88">
      Hands-on expertise across <tspan fill="#c084fc" font-weight="600">Azure AI</tspan>, <tspan fill="#ffd043" font-weight="600">MLOps (MLflow, Hugging Face)</tspan>, and automated geospatial pipelines.
    </text>
  </g>

  <!-- Bottom Specs / Technologies Bar -->
  <g transform="translate(24, 178)">
    <g transform="translate(0, 0)">
      <rect class="pill" width="195" height="28"/>
      <circle cx="12" cy="14" r="3.5" fill="#30d158"/>
      <text class="spec-text" x="24" y="18">Python • SQL • Power BI</text>
    </g>
    <g transform="translate(205, 0)">
      <rect class="pill" width="235" height="28"/>
      <circle cx="12" cy="14" r="3.5" fill="#38bdf8"/>
      <text class="spec-text" x="24" y="18">Azure AI • MLOps • NLP • CV</text>
    </g>
    <g transform="translate(450, 0)">
      <rect class="pill" width="185" height="28"/>
      <circle cx="12" cy="14" r="3.5" fill="#f5a623"/>
      <text class="spec-text" x="24" y="18">Scikit-Learn • PyTorch</text>
    </g>
    <g transform="translate(645, 0)">
      <rect class="pill" width="145" height="28"/>
      <circle cx="12" cy="14" r="3.5" fill="#c084fc"/>
      <text class="spec-text" x="24" y="18">ECPC ('23 &amp; '26)</text>
    </g>
    <g transform="translate(725, 0)">
      <rect class="pill" width="65" height="28"/>
      <text class="spec-text" x="14" y="18"><tspan class="cursor">▋</tspan></text>
    </g>
  </g>
</svg>
