<svg xmlns="http://www.w3.org/2000/svg" width="840" height="195" viewBox="0 0 840 195" fill="none" role="img" aria-labelledby="title-st desc-st">
  <title id="title-st">streak-telemetry</title>
  <desc id="desc-st">Real-time GitHub contribution streaks and engineering activity telemetry for Ahmed.</desc>
  <defs>
    <!-- Background Glass Base -->
    <linearGradient id="glass-base-st" x1="0" y1="0" x2="840" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10131e" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0a0c14" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#06070b" stop-opacity="0.99"/>
    </linearGradient>

    <!-- Static Base Border Stroke -->
    <linearGradient id="static-border-st" x1="0" y1="0" x2="840" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Animated Border Gradient Stroke -->
    <linearGradient id="border-beam-st" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Ambient Aurora Orbs -->
    <radialGradient id="aurora-st-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora-st-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#b91c1c" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0"/>
    </radialGradient>

    <!-- Header Glass Gradient -->
    <linearGradient id="header-glass-st" x1="0" y1="0" x2="0" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Card Pillar Base -->
    <linearGradient id="pillar-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b26" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0d111a" stop-opacity="0.95"/>
    </linearGradient>
    
    <linearGradient id="pillar-active" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#261b0a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#181105" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Traffic Lights -->
    <linearGradient id="btn-red-st" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff6b62"/><stop offset="100%" stop-color="#ea3e36"/></linearGradient>
    <linearGradient id="btn-yellow-st" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffd043"/><stop offset="100%" stop-color="#f5a623"/></linearGradient>
    <linearGradient id="btn-green-st" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3fe25e"/><stop offset="100%" stop-color="#1db939"/></linearGradient>

    <!-- Filter Shadow -->
    <filter id="win-shadow-st" x="-3%" y="-5%" width="106%" height="116%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="laser-glow-st" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes borderLaserLoopST {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -2070; }
    }
    .laser-border-st {
      stroke: url(#border-beam-st);
      stroke-width: 1.8;
      stroke-dasharray: 20 40 80 40 20 60 140 250 20 50 100 250;
      stroke-linecap: round;
      animation: borderLaserLoopST 14s linear infinite;
    }
    .window-title { font: 500 12px ui-monospace, SFMono-Regular, monospace; fill: #86868b; }
    .metric-num { font: 800 24px ui-monospace, SFMono-Regular, monospace; fill: #f8fafc; }
    .metric-fire { font: 800 24px ui-monospace, SFMono-Regular, monospace; fill: #f59e0b; }
    .metric-sub { font: 600 11px ui-monospace, SFMono-Regular, monospace; fill: #94a3b8; letter-spacing: 0.5px; }
    .metric-tag { font: 700 10px ui-monospace, SFMono-Regular, monospace; fill: #38bdf8; }
    .active-tag { font: 700 10px ui-monospace, SFMono-Regular, monospace; fill: #34d399; }
    .footer-label { font: 500 11px ui-monospace, monospace; fill: #64748b; }
    .footer-val { font: 700 11px ui-monospace, monospace; fill: #cbd5e1; }
  </style>

  <!-- Main Container -->
  <rect x="2" y="2" width="836" height="191" rx="14" fill="url(#glass-base-st)" stroke="url(#static-border-st)" stroke-width="1.2" filter="url(#win-shadow-st)"/>

  <!-- Aurora Lights -->
  <clipPath id="streak-clip">
    <rect x="3" y="3" width="834" height="189" rx="13"/>
  </clipPath>
  <g clip-path="url(#streak-clip)">
    <circle cx="180" cy="90" r="140" fill="url(#aurora-st-1)"/>
    <circle cx="680" cy="110" r="150" fill="url(#aurora-st-2)"/>
  </g>

  <!-- Running Laser Border -->
  <rect class="laser-border-st" x="2" y="2" width="836" height="191" rx="14" fill="none" filter="url(#laser-glow-st)"/>

  <!-- Titlebar Header -->
  <path d="M 2 14 C 2 7.37 7.37 2 14 2 L 826 2 C 832.63 2 838 7.37 838 14 L 838 34 L 2 34 Z" fill="url(#header-glass-st)"/>
  <line x1="2" y1="34" x2="838" y2="34" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Traffic Lights -->
  <g transform="translate(18, 12)">
    <circle cx="5" cy="5" r="4.5" fill="url(#btn-red-st)"/>
    <circle cx="20" cy="5" r="4.5" fill="url(#btn-yellow-st)"/>
    <circle cx="35" cy="5" r="4.5" fill="url(#btn-green-st)"/>
  </g>
  <text class="window-title" x="420" y="21" text-anchor="middle">streak-telemetry // real-time engineering cadence &amp; streaks</text>

  <!-- 3 Main Columns / Cards -->
  
  <!-- Card 1: Total Contributions -->
  <g transform="translate(24, 46)">
    <rect x="0" y="0" width="248" height="98" rx="10" fill="url(#pillar-card)" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    <text class="metric-tag" x="18" y="24">⚡ AGGREGATED METRIC</text>
    <text class="metric-num" x="18" y="58" id="val-total-contrib">148</text>
    <text class="metric-sub" x="18" y="82">TOTAL CONTRIBUTIONS</text>
  </g>

  <!-- Card 2: Current Streak (Focal Point) -->
  <g transform="translate(296, 46)">
    <rect x="0" y="0" width="248" height="98" rx="10" fill="url(#pillar-active)" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="218" cy="22" r="4" fill="#34d399"/>
    <text class="active-tag" x="208" y="25" text-anchor="end">LIVE CADENCE</text>
    <text class="metric-fire" x="18" y="58" id="val-curr-streak">0 Days 🔥</text>
    <text class="metric-sub" x="18" y="82" fill="#fbbf24">CURRENT DAILY STREAK</text>
  </g>

  <!-- Card 3: Longest Streak -->
  <g transform="translate(568, 46)">
    <rect x="0" y="0" width="248" height="98" rx="10" fill="url(#pillar-card)" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
    <text class="metric-tag" x="18" y="24" fill="#a78bfa">🏆 PERSONAL BEST</text>
    <text class="metric-num" x="18" y="58" id="val-longest-streak">5 Days</text>
    <text class="metric-sub" x="18" y="82">LONGEST STREAK RECORD</text>
  </g>

  <!-- Bottom Telemetry Divider & Metrics -->
  <line x1="24" y1="158" x2="816" y2="158" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  
  <g transform="translate(24, 175)">
    <text class="footer-label" x="0" y="0">Total Pushes:</text>
    <text class="footer-val" x="78" y="0" id="val-total-pushes">154+</text>

    <text class="footer-label" x="180" y="0">Indexed Repos:</text>
    <text class="footer-val" x="268" y="0" id="val-repos">14</text>

    <text class="footer-label" x="350" y="0">Followers:</text>
    <text class="footer-val" x="415" y="0">19</text>

    <text class="footer-label" x="510" y="0">Status:</text>
    <text class="footer-val" x="555" y="0" fill="#34d399">ACTIVE ⚡</text>

    <text class="footer-label" x="660" y="0">Cadence:</text>
    <text class="footer-val" x="715" y="0" fill="#f59e0b">COMMITTED 🚀</text>
  </g>
</svg>
