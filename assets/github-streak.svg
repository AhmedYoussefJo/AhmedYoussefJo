<svg xmlns="http://www.w3.org/2000/svg" width="410" height="215" viewBox="0 0 410 215" fill="none" role="img" aria-labelledby="title-st desc-st">
  <title id="title-st">streak-telemetry</title>
  <desc id="desc-st">Real-time GitHub contribution streaks and engineering activity telemetry for Ahmed.</desc>
  <defs>
    <!-- Background Glass Base -->
    <linearGradient id="glass-base-st" x1="0" y1="0" x2="410" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10131e" stop-opacity="0.92"/>
      <stop offset="50%" stop-color="#0a0c14" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#06070b" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Static Base Border Stroke -->
    <linearGradient id="static-border-st" x1="0" y1="0" x2="410" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Animated Border Gradient Stroke -->
    <linearGradient id="border-beam-st" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Ambient Aurora Orbs -->
    <radialGradient id="aurora-st-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora-st-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#b91c1c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0"/>
    </radialGradient>

    <!-- Header Glass Gradient -->
    <linearGradient id="header-glass-st" x1="0" y1="0" x2="0" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Traffic Lights -->
    <linearGradient id="btn-red-st" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff6b62"/><stop offset="100%" stop-color="#ea3e36"/></linearGradient>
    <linearGradient id="btn-yellow-st" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffd043"/><stop offset="100%" stop-color="#f5a623"/></linearGradient>
    <linearGradient id="btn-green-st" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3fe25e"/><stop offset="100%" stop-color="#1db939"/></linearGradient>

    <!-- Filter Shadow -->
    <filter id="win-shadow-st" x="-5%" y="-5%" width="110%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="laser-glow-st" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.7"/>
    </filter>
  </defs>

  <style>
    @keyframes borderLaserLoopST {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1226; }
    }
    .laser-border-st {
      stroke: url(#border-beam-st);
      stroke-width: 1.8;
      stroke-dasharray: 8 16 32 20 8 16 60 140 8 16 40 140;
      stroke-linecap: round;
      animation: borderLaserLoopST 12s linear infinite;
    }
    .laser-border-fast-st {
      stroke: #f59e0b;
      stroke-width: 1.5;
      stroke-dasharray: 30 220 60 250;
      stroke-linecap: round;
      animation: borderLaserLoopST 8s linear infinite;
      opacity: 0.75;
    }

    @keyframes auroraST {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0.65; }
      50% { transform: translate(30px, -15px) scale(1.15); opacity: 0.9; }
      100% { transform: translate(0px, 0px) scale(1); opacity: 0.65; }
    }
    .aurora-st { animation: auroraST 10s ease-in-out infinite; }

    .window-title { font: 500 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; fill: #86868b; }
    .label { font: 500 12px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #a1a1a6; }
    .value { font: 700 14px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #f5f5f7; }
    .streak-fire { font: 700 14px ui-monospace, monospace; fill: #f59e0b; }
    .streak-status { font: 800 11px ui-monospace, monospace; fill: #34d399; }
    .rank-badge { font: 800 12px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #f59e0b; }
  </style>

  <!-- Container Base -->
  <rect x="2" y="2" width="406" height="211" rx="14" fill="url(#glass-base-st)" stroke="url(#static-border-st)" stroke-width="1.2" filter="url(#win-shadow-st)"/>

  <!-- Clip Path -->
  <clipPath id="streak-clip">
    <rect x="3" y="3" width="404" height="209" rx="13"/>
  </clipPath>

  <g clip-path="url(#streak-clip)">
    <g class="aurora-st">
      <circle cx="90" cy="80" r="120" fill="url(#aurora-st-1)"/>
      <circle cx="320" cy="140" r="130" fill="url(#aurora-st-2)"/>
    </g>
  </g>

  <!-- Running Border Laser -->
  <rect class="laser-border-st" x="2" y="2" width="406" height="211" rx="14" fill="none" filter="url(#laser-glow-st)"/>
  <rect class="laser-border-fast-st" x="2" y="2" width="406" height="211" rx="14" fill="none"/>

  <!-- Titlebar Header -->
  <path d="M 2 14 C 2 7.37 7.37 2 14 2 L 396 2 C 402.63 2 408 7.37 408 14 L 408 36 L 2 36 Z" fill="url(#header-glass-st)"/>
  <line x1="2" y1="36" x2="408" y2="36" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>

  <!-- Window Controls -->
  <g transform="translate(16, 12)">
    <circle cx="5" cy="5" r="5" fill="url(#btn-red-st)"/>
    <circle cx="20" cy="5" r="5" fill="url(#btn-yellow-st)"/>
    <circle cx="35" cy="5" r="5" fill="url(#btn-green-st)"/>
  </g>

  <!-- Centered Title -->
  <text class="window-title" x="205" y="22" text-anchor="middle">streak-telemetry</text>

  <!-- Real User Streak Metrics -->
  <text x="24" y="68" class="label">Total Contributions</text>
  <text x="180" y="68" text-anchor="end" class="value" id="val-total-contrib">142</text>
  
  <text x="215" y="68" class="label">Current Streak</text>
  <text x="386" y="68" text-anchor="end" class="streak-fire" id="val-curr-streak">2 Days 🔥</text>

  <text x="24" y="102" class="label">Longest Streak</text>
  <text x="180" y="102" text-anchor="end" class="value" id="val-longest-streak">5 Days</text>
  
  <text x="215" y="102" class="label">Total Pushes</text>
  <text x="386" y="102" text-anchor="end" class="value" id="val-total-pushes">249+</text>

  <text x="24" y="136" class="label">Public Repos</text>
  <text x="180" y="136" text-anchor="end" class="value" id="val-repos">13</text>
  
  <text x="215" y="136" class="label">Daily Status</text>
  <text x="386" y="136" text-anchor="end" class="streak-status" id="val-status">ACTIVE</text>

  <line x1="24" y1="168" x2="386" y2="168" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
  
  <!-- Footer Status -->
  <g transform="translate(24, 180)">
    <text y="14" class="label">Commit Continuity</text>
    <rect x="250" y="-2" width="112" height="24" rx="6" fill="#261b0a" fill-opacity="0.85" stroke="#f59e0b" stroke-width="1"/>
    <text x="306" y="14.5" text-anchor="middle" class="rank-badge">COMMITTED ⚡</text>
  </g>
</svg>
