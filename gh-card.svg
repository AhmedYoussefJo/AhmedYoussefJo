<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .term-title { font-family: 'Courier New', monospace; font-size: 14px; fill: #4ade80; font-weight: bold; }
      .status-text { font-family: 'Courier New', monospace; font-size: 11px; font-weight: bold; fill: #22c55e; }
      .section-label { font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold; fill: #4ade80; letter-spacing: 1.5px; }
      .prompt-head { font-family: 'Courier New', monospace; font-size: 15px; font-weight: bold; fill: #4ade80; }
      .lbl { font-family: 'Courier New', monospace; font-size: 13px; fill: #86efac; }
      .val { font-family: 'Courier New', monospace; font-size: 13px; fill: #f0fdf4; }
      .val-bold { font-family: 'Courier New', monospace; font-size: 13px; fill: #ffffff; font-weight: bold; }
      .val-highlight { font-family: 'Courier New', monospace; font-size: 13px; fill: #4ade80; font-weight: bold; }
      .footer-quote { font-family: 'Courier New', monospace; font-size: 11px; font-weight: bold; fill: #22c55e; letter-spacing: 1px; }
      
      /* Dynamic Navigation Tabs Styling */
      .nav-tab { cursor: pointer; }
      .tab-bg { fill: #0d2818; stroke: #166534; stroke-width: 1.5; transition: all 0.2s; }
      .tab-text { font-family: 'Courier New', monospace; font-size: 12px; font-weight: bold; fill: #86efac; }
      .nav-tab:hover .tab-bg { fill: #14532d; stroke: #22c55e; }
      .nav-tab:hover .tab-text { fill: #ffffff; }

      /* Tab Switching Engine */
      .page-content { display: none; }
      #tab-about:checked ~ #page-about,
      #tab-skills:checked ~ #page-skills,
      #tab-projects:checked ~ #page-projects,
      #tab-experience:checked ~ #page-experience,
      #tab-certs:checked ~ #page-certs,
      #tab-contact:checked ~ #page-contact { display: block; }

      /* Active Tab Highlighting */
      #tab-about:checked ~ g label[for="tab-about"] .tab-bg,
      #tab-skills:checked ~ g label[for="tab-skills"] .tab-bg,
      #tab-projects:checked ~ g label[for="tab-projects"] .tab-bg,
      #tab-experience:checked ~ g label[for="tab-experience"] .tab-bg,
      #tab-certs:checked ~ g label[for="tab-certs"] .tab-bg,
      #tab-contact:checked ~ g label[for="tab-contact"] .tab-bg { fill: #15803d; stroke: #4ade80; stroke-width: 2; }

      #tab-about:checked ~ g label[for="tab-about"] .tab-text,
      #tab-skills:checked ~ g label[for="tab-skills"] .tab-text,
      #tab-projects:checked ~ g label[for="tab-projects"] .tab-text,
      #tab-experience:checked ~ g label[for="tab-experience"] .tab-text,
      #tab-certs:checked ~ g label[for="tab-certs"] .tab-text,
      #tab-contact:checked ~ g label[for="tab-contact"] .tab-text { fill: #ffffff; font-weight: bold; }
    </style>

    <clipPath id="portrait-clip">
      <rect x="35" y="70" width="160" height="180" rx="8"/>
    </clipPath>
  </defs>

